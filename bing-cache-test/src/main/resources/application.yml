# Bing Cache 配置
bing:
  cache:
    # Caffeine 本地缓存配置
    caffeine:
      max-size: 5000
      l1-max-ttl: 300  # L1 最大存活 5 分钟

    # Redis 分布式缓存配置
    redis:
      enabled: true
      key-prefix: "demo-cache:"
      channel-name: "demo-cache:invalidation"

    # 版本协调服务配置
    reconciliation:
      enabled: true
      interval: 30  # 每 30 秒检查一次

# Spring Boot Redis 配置
spring:
  data:
    redis:
      # 连接信息通过环境变量注入，避免仓库中硬编码真实凭据：
      #   BING_CACHE_REDIS_HOST      默认 cmac-mini
      #   BING_CACHE_REDIS_PASSWORD  无默认值，未设置时密码为空
      host: ${BING_CACHE_REDIS_HOST:cmac-mini}
      port: 6379
      password: "${BING_CACHE_REDIS_PASSWORD:}"

# 服务端口
server:
  port: 8080

# 日志配置
logging:
  level:
    com.bing.cache: DEBUG
    com.example.demo: DEBUG
